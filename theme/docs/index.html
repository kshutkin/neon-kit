<!DOCTYPE html>
<html lang="en" class="h-screen bg-surface dark:bg-surface-dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Project Neon</title>
    <!-- prerender:head -->
    <link rel="stylesheet" href="./index-docs.css">
</head>
<body class="flex h-screen bg-surface dark:bg-surface-dark text-ink-primary dark:text-ink-primary-dark">
    <aside class="flex w-72 flex-col border-r border-border bg-surface-secondary dark:border-border-dark dark:bg-surface-secondary-dark">
        <header class="border-b border-border p-6 dark:border-border-dark">
            <div class="text-xs font-medium uppercase tracking-wide text-ink-secondary dark:text-ink-secondary-dark">Theme Docs</div>
            <h1 class="mt-2 text-2xl font-bold">Project Neon</h1>
            <p class="mt-2 text-sm text-ink-secondary dark:text-ink-secondary-dark">Component and token reference for the current theme system.</p>
        </header>
        <nav class="flex-1 p-4">
            <ul class="list-none space-y-1 pl-0">
                <li><a data-slug="buttons" href="buttons/" class="nav-link block rounded px-3 py-2 text-ink-primary dark:text-ink-primary-dark">Buttons</a></li>
                <li><a data-slug="panels" href="panels/" class="nav-link block rounded px-3 py-2 text-ink-primary dark:text-ink-primary-dark">Panels</a></li>
                <li><a data-slug="dialogs" href="dialogs/" class="nav-link block rounded px-3 py-2 text-ink-primary dark:text-ink-primary-dark">Dialogs</a></li>
                <li><a data-slug="menus" href="menus/" class="nav-link block rounded px-3 py-2 text-ink-primary dark:text-ink-primary-dark">Menus</a></li>
                <li><a data-slug="typography" href="typography/" class="nav-link block rounded px-3 py-2 text-ink-primary dark:text-ink-primary-dark">Typography</a></li>
                <li><a data-slug="colors" href="colors/" class="nav-link block rounded px-3 py-2 text-ink-primary dark:text-ink-primary-dark">Colors</a></li>
                <li><a data-slug="links" href="links/" class="nav-link block rounded px-3 py-2 text-ink-primary dark:text-ink-primary-dark">Links</a></li>
                <li><a data-slug="shadows" href="shadows/" class="nav-link block rounded px-3 py-2 text-ink-primary dark:text-ink-primary-dark">Shadows</a></li>
                <li><a data-slug="utilities" href="utilities/" class="nav-link block rounded px-3 py-2 text-ink-primary dark:text-ink-primary-dark">Utilities</a></li>
            </ul>
        </nav>
    </aside>
    <main id="content" class="min-w-0 flex-1 overflow-y-auto bg-surface dark:bg-surface-dark">
        <div id="content-inner" class="p-8"></div>
    </main>
    <theme-switcher></theme-switcher>
    <script src="./theme-switcher.js" type="module"></script>
    <script type="module">
        const fragments = import.meta.glob('./sections/*.html', { query: '?raw', import: 'default', eager: true });

        const fragmentFor = (slug) => fragments[`./sections/${slug}.html`];

        const titles = {
            buttons: 'Buttons',
            panels: 'Panels',
            dialogs: 'Dialogs',
            menus: 'Menus',
            typography: 'Typography',
            colors: 'Colors',
            links: 'Links',
            shadows: 'Shadows',
            utilities: 'Utilities',
        };

        const DEFAULT_SLUG = 'buttons';
        const BASE = import.meta.env.BASE_URL || '/';

        const links = document.querySelectorAll('nav a[data-slug]');
        const content = document.getElementById('content');
        const contentInner = document.getElementById('content-inner');

        // Backwards-compat: rewrite legacy `#/<slug>` URLs to `<slug>/`.
        if (location.hash.startsWith('#/')) {
            const legacy = location.hash.slice(2).replace(/\/+$/, '');
            if (legacy in titles) {
                history.replaceState(null, '', `${BASE}${legacy}/`);
            } else {
                history.replaceState(null, '', BASE);
            }
        }

        const currentSlug = () => {
            let path = location.pathname;
            if (path.startsWith(BASE)) path = path.slice(BASE.length);
            path = path.replace(/^\/+|\/+$/g, '');
            const slug = path.split('/')[0] || DEFAULT_SLUG;
            return slug in titles ? slug : DEFAULT_SLUG;
        };

        const setActiveLink = (slug) => {
            for (const link of links) {
                const isActive = link.dataset.slug === slug;
                link.classList.toggle('bg-primary', isActive);
                link.classList.toggle('dark:bg-primary-dark', isActive);
                link.classList.toggle('text-ink-inverse', isActive);
                link.classList.toggle('font-semibold', isActive);
                link.classList.toggle('inset-shadow-highlight', isActive);
                link.classList.toggle('dark:inset-shadow-highlight-dark', isActive);
                link.classList.toggle('shadow-drop-subtle', isActive);
                link.classList.toggle('dark:shadow-drop-subtle-dark', isActive);
                link.classList.toggle('text-ink-primary', !isActive);
                link.classList.toggle('dark:text-ink-primary-dark', !isActive);
            }
        };

        let firstRender = true;
        const render = () => {
            const slug = currentSlug();
            // Skip overwriting innerHTML on initial render if the page was prerendered
            // with content already in place — avoids a flash.
            if (!(firstRender && contentInner.children.length > 0)) {
                contentInner.innerHTML = fragmentFor(slug) ?? '';
            }
            firstRender = false;
            setActiveLink(slug);
            document.title = `Project Neon — ${titles[slug]}`;
            content.scrollTop = 0;
        };

        // Intercept clicks on internal nav links for soft (no-reload) navigation.
        document.addEventListener('click', (e) => {
            if (e.defaultPrevented) return;
            if (e.button !== 0 || e.metaKey || e.ctrlKey || e.shiftKey || e.altKey) return;
            const a = e.target.closest('a[data-slug]');
            if (!a) return;
            const slug = a.dataset.slug;
            if (!(slug in titles)) return;
            e.preventDefault();
            const target = `${BASE}${slug}/`;
            if (location.pathname !== target) {
                history.pushState(null, '', target);
                render();
            }
        });

        addEventListener('popstate', render);
        render();

        // Delegated dialog handlers — fragments are injected via innerHTML
        // so per-fragment <script> tags don't run; wire behavior here.
        document.addEventListener('click', (e) => {
            const opener = e.target.closest('[data-open]');
            if (opener) {
                const dlg = document.getElementById(opener.getAttribute('data-open'));
                if (dlg && typeof dlg.showModal === 'function') dlg.showModal();
                return;
            }
            const closer = e.target.closest('[data-close]');
            if (closer) {
                const dlg = closer.closest('dialog');
                if (dlg) {
                    e.preventDefault();
                    dlg.close();
                }
                return;
            }
            // Backdrop click closes the dialog
            if (e.target.matches('dialog.dialog')) {
                e.target.close();
            }
        });

        document.addEventListener('close', (e) => {
            const dlg = e.target;
            if (dlg.id !== 'dlg-confirm') return;
            const out = document.getElementById('confirm-result');
            if (!out) return;
            out.textContent =
                dlg.returnValue === 'confirm'
                    ? 'Deleted.'
                    : dlg.returnValue
                        ? `Dismissed (${dlg.returnValue}).`
                        : 'Dismissed.';
        }, true);

        if (import.meta.hot) {
            import.meta.hot.accept(() => render());
        }
    </script>
</body>
</html>
