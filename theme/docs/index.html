<!DOCTYPE html>
<html lang="en" class="h-screen bg-surface dark:bg-surface-dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Neon Project</title>
    <link rel="stylesheet" href="./index-docs.css">
</head>
<body class="flex h-screen bg-surface dark:bg-surface-dark text-ink-primary dark:text-ink-primary-dark">
    <aside class="flex w-72 flex-col border-r border-border bg-surface-secondary dark:border-border-dark dark:bg-surface-secondary-dark">
        <header class="border-b border-border p-6 dark:border-border-dark">
            <div class="text-xs font-medium uppercase tracking-wide text-ink-secondary dark:text-ink-secondary-dark">Theme Docs</div>
            <h1 class="mt-2 text-2xl font-bold">Project Neon</h1>
            <p class="mt-2 text-sm text-ink-secondary dark:text-ink-secondary-dark">Component and token reference for the current theme system.</p>
        </header>
        <nav class="flex-1 p-4">
            <ul class="list-none space-y-1 pl-0">
                <li><a href="#/buttons" class="nav-link block rounded px-3 py-2 text-ink-primary dark:text-ink-primary-dark">Buttons</a></li>
                <li><a href="#/panels" class="nav-link block rounded px-3 py-2 text-ink-primary dark:text-ink-primary-dark">Panels</a></li>
                <li><a href="#/dialogs" class="nav-link block rounded px-3 py-2 text-ink-primary dark:text-ink-primary-dark">Dialogs</a></li>
                <li><a href="#/typography" class="nav-link block rounded px-3 py-2 text-ink-primary dark:text-ink-primary-dark">Typography</a></li>
                <li><a href="#/colors" class="nav-link block rounded px-3 py-2 text-ink-primary dark:text-ink-primary-dark">Colors</a></li>
                <li><a href="#/links" class="nav-link block rounded px-3 py-2 text-ink-primary dark:text-ink-primary-dark">Links</a></li>
                <li><a href="#/shadows" class="nav-link block rounded px-3 py-2 text-ink-primary dark:text-ink-primary-dark">Shadows</a></li>
                <li><a href="#/utilities" class="nav-link block rounded px-3 py-2 text-ink-primary dark:text-ink-primary-dark">Utilities</a></li>
                <li><a href="#/borders" class="nav-link block rounded px-3 py-2 text-ink-primary dark:text-ink-primary-dark">Borders</a></li>
            </ul>
        </nav>
    </aside>
    <main id="content" class="min-w-0 flex-1 overflow-y-auto bg-surface dark:bg-surface-dark">
        <div id="content-inner" class="p-8"></div>
    </main>
    <theme-switcher></theme-switcher>
    <script src="./theme-switcher.js" type="module"></script>
    <script type="module">
        const fragments = import.meta.glob('./sections/*.html', { query: '?raw', import: 'default', eager: true });

        const fragmentFor = (slug) => fragments[`./sections/${slug}.html`];

        const titles = {
            buttons: 'Buttons',
            panels: 'Panels',
            dialogs: 'Dialogs',
            typography: 'Typography',
            colors: 'Colors',
            links: 'Links',
            shadows: 'Shadows',
            utilities: 'Utilities',
            borders: 'Borders',
        };

        const links = document.querySelectorAll('nav a');
        const content = document.getElementById('content');
        const contentInner = document.getElementById('content-inner');

        const currentSlug = () => {
            const hash = location.hash.slice(1) || '/';
            const slug = hash.replace(/^\//, '') || 'buttons';
            return slug in titles ? slug : 'buttons';
        };

        const setActiveLink = (slug) => {
            const targetHash = `#/${slug}`;
            for (const link of links) {
                const isActive = link.getAttribute('href') === targetHash;
                link.classList.toggle('bg-primary', isActive);
                link.classList.toggle('dark:bg-primary-dark', isActive);
                link.classList.toggle('text-ink-inverse', isActive);
                link.classList.toggle('font-semibold', isActive);
                link.classList.toggle('inset-shadow-highlight', isActive);
                link.classList.toggle('dark:inset-shadow-highlight-dark', isActive);
                link.classList.toggle('shadow-drop-subtle', isActive);
                link.classList.toggle('dark:shadow-drop-subtle-dark', isActive);
                link.classList.toggle('text-ink-primary', !isActive);
                link.classList.toggle('dark:text-ink-primary-dark', !isActive);
            }
        };

        const render = () => {
            const slug = currentSlug();
            contentInner.innerHTML = fragmentFor(slug) ?? '';
            setActiveLink(slug);
            document.title = `Project Neon — ${titles[slug]}`;
            content.scrollTop = 0;
        };

        addEventListener('hashchange', render);
        render();

        if (import.meta.hot) {
            import.meta.hot.accept(() => render());
        }
    </script>
</body>
</html>
